<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Convite · Samuel Dante 4 anos</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b16;--panel:#111a2b;--ink:#f2f6ff;--green:#4cd137;--green-d:#1f7a14;--red:#d63a2f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'VT323',ui-monospace,monospace;display:flex;justify-content:center}
.card{position:relative;width:100%;max-width:760px}
.card img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.hot{position:absolute;display:block;border:0;background:transparent;cursor:pointer;border-radius:10px;-webkit-tap-highlight-color:transparent;transition:box-shadow .15s,background .15s,transform .1s}
.hot:hover,.hot:focus-visible{background:rgba(120,255,100,.12);box-shadow:0 0 0 3px #7dff63,0 0 22px 4px rgba(125,255,99,.55);outline:none}
.hot:active{transform:scale(.98)}
.hot span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#loc{left:60%;top:54.5%;width:16.4%;height:16.4%}
#rsvp{left:29.8%;top:73.5%;width:40.4%;height:10.6%}
dialog{border:0;padding:0;background:transparent;max-width:none;width:100%;color:var(--ink)}
dialog::backdrop{background:rgba(2,4,10,.78)}
.box{margin:auto;width:min(92vw,430px);background:var(--panel);border:4px solid #3a4560;box-shadow:inset 0 0 0 4px #0a1020,0 12px 40px rgba(0,0,0,.6);padding:22px 20px 20px;font-size:23px}
.box h2{margin:0 0 4px;font-weight:400;font-size:34px;color:var(--green);line-height:1}
.box p{margin:0 0 14px;opacity:.85;line-height:1.1}
label{display:block;margin:12px 0 4px}
input{width:100%;font:inherit;font-size:26px;color:var(--ink);background:#060a14;border:3px solid #3a4560;padding:8px 10px;border-radius:0}
input:focus{outline:none;border-color:var(--green)}
.row{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;font:inherit;font-size:26px;padding:10px 12px;border:3px solid;cursor:pointer;color:#fff;border-radius:0}
.go{background:var(--green-d);border-color:#7dff63}
.go:hover,.go:focus-visible{background:#28a01a;outline:none}
.no{background:#1b2438;border-color:#3a4560;flex:.6}
.no:hover,.no:focus-visible{background:#26314b;outline:none}
.err{color:#ff7b6b;min-height:22px;margin-top:8px;font-size:21px}
.hint{font-size:19px;opacity:.65;margin-top:12px;line-height:1.05}
@media (prefers-reduced-motion:reduce){.hot{transition:none}}
</style>
</head>

  function open(){err.textContent='';if(dlg.showModal){dlg.showModal()}else{dlg.setAttribute('open','')}nome.focus()}
  function close(){if(dlg.close){dlg.close()}else{dlg.removeAttribute('open')}}
  document.getElementById('rsvp').addEventListener('click',open);
  document.getElementById('cancel').addEventListener('click',close);
  dlg.addEventListener('click',function(e){if(e.target===dlg)close()});
  document.getElementById('send').addEventListener('click',function(){
    var n=nome.value.trim(),q=parseInt(qtd.value,10);
    if(!n){err.textContent='Digite seu nome para confirmar.';nome.focus();return}
    if(!q||q<1){err.textContent='Informe quantas pessoas vão.';qtd.focus();return}
    var subj="Confirmação de presença - Samuel Dante 4 anos";
    var body="Olá! Confirmo presença no aniversário de 4 anos do Samuel Dante.\n\nNome: "+n+"\nPessoas: "+q+"\n\nData: 11/10/2026 (domingo), às 17h\nLocal: Condomínio Luar Ponta Negra";
    var a=document.createElement('a');
    a.href="mailto:"+TO+"?subject="+encodeURIComponent(subj)+"&body="+encodeURIComponent(body);
    a.target="_blank";a.rel="noopener";
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    close();
  });
})();
</script>
